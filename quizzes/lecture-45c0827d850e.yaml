- id: question-4415222f2d4d
  prompt: In the Python SDK example, a tool is defined by a plain function with type hints and a docstring
    — no JSON written by hand. What does the SDK do with those?
  options:
  - id: option-0a91ecd67cfb
    text: It compiles the function to WebAssembly so the host can execute it in a sandbox
    correct: false
    explanation: The SDK does not compile or sandbox your code. Your function runs inside your own server
      process; the SDK only wraps it in the protocol.
    citations: []
  - id: option-84a26094a854
    text: It generates the tool's JSON Schema and description from the type hints and docstring, and handles
      validation and the JSON-RPC protocol
    correct: true
    explanation: 'a: int, b: int is the schema and the docstring becomes the description. The SDK generates
      the tool definitions, validates arguments, and handles the wire format.'
    citations: []
  - id: option-38fd76a364b1
    text: It encrypts the docstring and sends it separately from the tool's schema
    correct: false
    explanation: There is no encryption step. The docstring simply becomes the tool's description inside
      its definition, alongside the generated inputSchema.
    citations: []
  - id: option-cad7ad00699c
    text: It requires you to also hand-write an inputSchema JSON file that overrides the type hints
    correct: false
    explanation: 'That would defeat the point of the SDK: the type hints are the schema. No separate hand-written
      schema file is needed.'
    citations: []
