- id: question-de60cbdd1d10
  prompt: 'The MCP Inspector ships as a single package with three clients: Web, CLI, and TUI. Which client
    is the right choice for a CI pipeline that lists a server''s tools and asserts on the output?'
  options:
  - id: option-de5ddcd385ff
    text: 'The CLI client, launched with --cli: scriptable and machine-readable, built for CI and shell
      pipelines'
    correct: true
    explanation: The CLI client is described as a scriptable, machine-readable client for CI, shell pipelines,
      and coding agents — for example --method tools/list piped into jq.
    citations: []
  - id: option-c37c01310909
    text: The Web client, because it can export the raw message log to a file for parsing
    correct: false
    explanation: The Web client is a full graphical inspector in the browser, the richest surface for
      humans. The scriptable, machine-readable interface is the CLI client.
    citations: []
  - id: option-72f820f263b8
    text: The TUI client, because it runs in a terminal and can be driven by recorded keystrokes
    correct: false
    explanation: The TUI is an interactive terminal UI for when a browser is not available — it is for
      people, not for machine-readable scripting.
    citations: []
  - id: option-0db01a64a614
    text: Any of the three, because they share the same core and behave identically
    correct: false
    explanation: They do share one core, so a connection behaves identically across them — but only the
      CLI client is scriptable and machine-readable, which is what CI needs.
    citations: []
  citations:
  - source_id: source-09db13341176
    label: MCP Inspector — three clients behind one binary; the CLI is scriptable and machine-readable
      for CI
    url: null
    line_start: null
    line_end: null
- id: question-97d647712f27
  prompt: How does a host first learn what a server's tools are, and how does it then execute one of them?
  options:
  - id: option-550b90770669
    text: The server pushes tool definitions over Server-Sent Events when the session starts, and the
      host calls them by name
    correct: false
    explanation: 'Tool discovery is a request/response: the host asks via tools/list. Server-Sent Events
      are an optional part of the Streamable HTTP transport, not a discovery mechanism.'
    citations: []
  - id: option-944236502353
    text: The host calls tools/define once per tool, then invokes the tool as a plain function call
    correct: false
    explanation: There is no tools/define method. The host discovers tools via tools/list and executes
      one via tools/call.
    citations: []
  - id: option-1ffcaf8a887b
    text: The host subscribes with resources/subscribe and polls for tool changes
    correct: false
    explanation: resources/subscribe concerns resource updates, not tool discovery. Tool discovery is
      tools/list, and tool execution is tools/call.
    citations: []
  - id: option-f0a0fa2b3746
    text: The host discovers them via tools/list and executes one via tools/call
    correct: true
    explanation: 'Discovery first, execution second: tools/list returns tool definitions with their schemas,
      and tools/call executes the chosen tool with typed arguments.'
    citations: []
  citations:
  - source_id: source-cf5bfe1c2e86
    label: Understanding MCP servers — tools/list to discover, tools/call to execute
    url: null
