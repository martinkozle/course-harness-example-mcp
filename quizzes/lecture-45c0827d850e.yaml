questions:
- id: question-b0001469f46b
  prompt: Your server exposes a tool that writes to a database, a resource that holds API documentation,
    and a prompt template for drafting emails. Who decides when each of these is used?
  options:
  - id: option-329c4e80c99f
    text: The model decides when to call the tool, the application decides which resources to read, and
      the user selects the prompt
    correct: true
    explanation: Tools are model-controlled, resources are application-controlled, and prompts are user-controlled
      — the three blocks are defined precisely by who controls them.
    citations: []
  - id: option-b184351daa36
    text: The application decides when to call the tool, the model decides which resource to read, and
      the user selects the prompt
    correct: false
    explanation: 'This swaps the first two: tools are model-controlled — the LLM discovers and invokes
      them. Resources are application-controlled, read-only context data.'
    citations: []
  - id: option-0875668c9423
    text: 'All three are model-controlled: the LLM picks the tool, the resource, and the prompt in the
      same way'
    correct: false
    explanation: Only tools are model-controlled. Resources are passive, application-controlled data,
      and prompts are pre-built templates the user invokes.
    citations: []
  - id: option-c512d127771c
    text: 'None are automatic: all three require explicit user confirmation before they can be used'
    correct: false
    explanation: It is tools that may require user consent before execution, precisely because they can
      perform real, sometimes destructive actions. Resources and prompts are not consent-gated the same
      way.
    citations: []
  citations:
