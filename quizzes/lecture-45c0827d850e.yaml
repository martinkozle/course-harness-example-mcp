- id: question-b4d0aa4b5b8b
  prompt: You are running your MCP server over stdio. Why must you never write log messages to stdout?
  options:
  - id: option-82afc1004c98
    text: stdout is reserved for the host's own diagnostics, and writing there raises a permission error
    correct: false
    explanation: stdout is not reserved for host diagnostics. It is the protocol channel between host
      and server, which is exactly why stray output is dangerous.
    citations: []
  - id: option-983ad918eedd
    text: The stdio transport has no logging API, so any write to stdout crashes the SDK
    correct: false
    explanation: The SDK does not crash because a logging API is missing. The problem is what stdout carries,
      not a missing API.
    citations: []
  - id: option-f92e2cfc0c4c
    text: stdout carries the JSON-RPC message stream, so any stray output corrupts the protocol messages
      and breaks the server
    correct: true
    explanation: Over stdio, everything on stdout is interpreted as a protocol message, so a stray print()
      corrupts the JSON-RPC stream. Log to stderr or a file instead; over HTTP, stdout is fine.
    citations: []
  - id: option-6ba63646d8db
    text: JSON-RPC messages are binary over stdio, so text logging would break the framing
    correct: false
    explanation: MCP over stdio speaks JSON-RPC 2.0, which is JSON text, not binary. The corruption comes
      from stray text being read as (and breaking) protocol messages.
    citations: []
  citations:
  - source_id: source-cb7732d7d88f
    label: 'Build an MCP server — logging in MCP servers: never write to stdout for STDIO-based servers'
