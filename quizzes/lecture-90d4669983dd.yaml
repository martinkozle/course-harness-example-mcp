- id: question-ab9f8b99b697
  prompt: A host such as VS Code connects to three MCP servers at the same time. According to the architecture,
    what exists inside the host?
  options:
  - id: option-252d652cde2f
    text: One shared client that multiplexes all three servers over a single stateful session
    correct: false
    explanation: The host creates one MCP client for each MCP server; there is no shared multiplexing
      client in the architecture.
    citations: []
  - id: option-b3c29ad90ed2
    text: 'Three clients, one per server, but they are stateless: every message is independent and nothing
      about the session is retained'
    correct: false
    explanation: Each client maintains a stateful session with its server. That statefulness is why the
      initialize handshake and capability negotiation exist at session start.
    citations: []
  - id: option-9c975f029aee
    text: Three clients, one per server, each maintaining a dedicated, stateful session with its own server
    correct: true
    explanation: In the docs' example, VS Code instantiates one client object per server it connects to
      (Sentry, filesystem, ...), and each client holds a dedicated stateful connection.
    citations: []
  - id: option-381a99c5af30
    text: One data-layer client and one transport-layer client, because the two protocol layers each need
      their own connection
    correct: false
    explanation: 'The two layers describe one protocol: the data layer defines what is exchanged and the
      transport layer how. Layers do not create additional clients.'
    citations: []
