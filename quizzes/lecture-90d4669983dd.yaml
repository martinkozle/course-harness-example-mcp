- id: question-516d6f0f5c63
  prompt: After a successful handshake, the client sends notifications/initialized. What distinguishes
    this message from a request such as tools/list?
  options:
  - id: option-9be4ddb6d0fb
    text: It is encrypted with the session key negotiated during initialize
    correct: false
    explanation: The initialize exchange covers protocol version, capabilities, and identity — it does
      not negotiate a session encryption key.
    citations: []
  - id: option-fdff3134f70c
    text: It uses a different namespace, so the server must still reply with a result object
    correct: false
    explanation: 'The notifications/ prefix does not change the response rule: notifications are one-way
      and the receiver MUST NOT send a response.'
    citations: []
  - id: option-4e926d14740c
    text: It carries the id 0, which the server echoes back in an empty result
    correct: false
    explanation: Notifications carry no id at all — they MUST NOT include an ID. id 0 is not a reserved
      marker for one-way messages.
    citations: []
  - id: option-28b47bb8ae45
    text: It carries no id field, and the receiver MUST NOT send a response
    correct: true
    explanation: Requests carry a unique non-null id and get a response; notifications omit the id entirely
      and are one-way, which is why notifications/initialized never gets a reply.
    citations: []
