questions:
- id: question-5274b8773c7a
  prompt: Before MCP, every AI application hand-rolled its integrations for each tool and data source.
    What was the core cost of this pre-MCP approach?
  options:
  - id: option-1f088d5c4110
    text: N apps times M tools meant N-by-M one-off connectors, each with its own schema, so nothing could
      be reused across apps
    correct: true
    explanation: 'This is the fragmentation the standard fixes: integrations were per app and per tool,
      and tool-calling formats were provider-specific, so context and integrations could not move between
      apps or vendors.'
    citations: []
  - id: option-f02f4893378a
    text: JSON-RPC 2.0 had to be re-implemented for every app-tool pair, because no wire format existed
    correct: false
    explanation: JSON-RPC 2.0 is the standard message format that MCP itself uses. The pre-MCP problem
      was the lack of a shared protocol for discovering and invoking capabilities, not the absence of
      a wire format.
    citations: []
  - id: option-eeb3d11b49ce
    text: HTTP could not carry tool results, so each application invented its own framing
    correct: false
    explanation: HTTP and JSON were never the bottleneck — MCP is built directly on both, with stdio and
      Streamable HTTP as its transports. The fragmentation was in per-app, per-tool connector interfaces.
    citations: []
  - id: option-b186a0c3029f
    text: Language models could not be prompted in natural language, so every integration had to be hardcoded
    correct: false
    explanation: 'Natural-language prompting was never the obstacle. The cost was duplicated engineering:
      each app re-implemented every integration by hand, with no shared way for models to discover and
      invoke capabilities.'
    citations: []
