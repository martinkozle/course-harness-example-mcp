- id: question-96070bdd19fc
  prompt: During the initialize handshake, client and server exchange protocol versions and capabilities.
    What happens if no compatible protocol version is found?
  options:
  - id: option-a0db3eaa4dfa
    text: The client silently falls back to the oldest protocol version it knows and continues the session
    correct: false
    explanation: 'Version negotiation is explicit: if no compatible version is found, the connection terminates.
      There is no silent fallback to an older version.'
    citations: []
  - id: option-986db7dde277
    text: The connection terminates
    correct: true
    explanation: The handshake negotiates protocol version, capabilities, and identity; failing to agree
      on a compatible version ends the connection before normal operations begin.
    citations: []
  - id: option-e0b03743ce29
    text: The server downgrades to whatever version the client advertises, to keep the connection alive
    correct: false
    explanation: The server does not unilaterally downgrade. Version negotiation either succeeds for both
      sides or the connection terminates.
    citations: []
  - id: option-7c04f400b10d
    text: The version is re-negotiated lazily, with the first tools/list request carrying it
    correct: false
    explanation: Version agreement happens during initialize, before operations like tools/list can proceed.
      After success the client sends notifications/initialized.
    citations: []
