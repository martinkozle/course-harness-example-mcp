questions:
- id: question-9849b2d2d58f
  prompt: Why did MCP make tools first-class attack targets even though the wire protocol is ordinary
    JSON-RPC 2.0?
  options:
  - id: option-9a341ff105ee
    text: Because hosts run every server with the same privileges, so any server can read the others'
      memory
    correct: false
    explanation: Process isolation is not the distinctive risk. The shared risk is that the LLM itself
      consumes tool metadata as instructions.
    citations: []
  - id: option-70170090bf86
    text: Because tools are discoverable and described in natural language for the LLM, so the model that
      reads the descriptions can be manipulated by them
    correct: true
    explanation: Nothing on the wire is exotic; the new risk is semantic. The same discoverability and
      natural-language descriptions that make tools composable are what an attacker exploits.
    citations: []
  - id: option-1f616c68c8a2
    text: Because JSON-RPC 2.0 does not authenticate messages by default, so any peer can inject tool
      calls
    correct: false
    explanation: MCP provides an authorization framework for HTTP transports, including standard HTTP
      auth with OAuth recommended for tokens. The distinctive MCP risk is semantic, not missing authentication.
    citations: []
  - id: option-67115b7cbcc9
    text: Because MCP replaced HTTP with a new transport that lacks TLS by default
    correct: false
    explanation: MCP runs over stdio or Streamable HTTP — ordinary HTTP, where TLS and standard authentication
      are available. The attack surface grew because of the semantics, not the transport.
    citations: []
  citations:
  - source_id: source-cb9fbb96c2df
    label: Zhang et al. 2026, MCP Security Bench (MSB) — natural-language metadata enlarges the attack
      surface
    url: null
    line_start: null
    line_end: null
  - source_id: source-8f67ad0c4f39
    label: Bora & Anapu 2026, MCP security survey — probabilistic execution surface; data and control
      conflate
    url: null
