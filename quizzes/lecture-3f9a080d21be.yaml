- id: question-8895302eca37
  prompt: A survey of 41 defense papers on MCP security found a systematic gap. What was it?
  options:
  - id: option-b39bcdc2d586
    text: Half of them proposed availability mitigations at the transport layer, but none were evaluated
    correct: false
    explanation: 'The gap is the opposite: the surveyed papers did not propose availability defenses at
      all.'
    citations: []
  - id: option-f8d5a1041101
    text: All of them were evaluated only on simulated tools, never on real MCP deployments
    correct: false
    explanation: The reported gap concerns which threat dimension is addressed — integrity versus availability
      — not the realism of the evaluation setup.
    citations: []
  - id: option-29dce787401f
    text: All 41 surveyed defense papers focus exclusively on integrity, with zero availability protections
    correct: true
    explanation: 'Bora & Anapu identify this as a critical research gap: surveyed defenses target integrity,
      leaving denial-of-service and availability risks unaddressed.'
    citations: []
  - id: option-5fe9b1bb70c4
    text: Only the rug-pull defenses addressed availability; the rest ignored denial of service
    correct: false
    explanation: No surveyed defense addressed availability at all. The zero-availability finding is the
      point of the gap.
    citations: []
  citations:
  - source_id: source-8f67ad0c4f39
    label: Bora & Anapu 2026 — all 41 surveyed defense papers focus exclusively on integrity, with zero
      availability protections
    url: null
    line_start: null
    line_end: null
