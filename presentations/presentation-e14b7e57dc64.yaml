- id: slide-068ae31a6a98
  archived: false
  layout: bullets
  title: Mitigations by Layer
  bullets:
  - 'Protocol: OAuth 2.1, TLS, strict egress — never model-only defenses'
  - 'Host/client: static metadata validation and parameter visibility'
  - 'Capability: least privilege via OAuth scopes, gateways, zero-trust identity'
  - 'Runtime: behavioral anomaly detection, decision-path tracking'
  - 'Human: transparency and human-in-the-loop for sensitive tool calls'
  speaker_notes: 'Bora & Anapu''s Trust Boundary Mitigation Framework (TBMF) combines MCP gateways, zero-trust
    identity, capability-based least privilege via OAuth scopes, runtime behavioral monitoring, and human-in-the-loop
    governance, and maps threats to OWASP Agentic Top 10 2026, MITRE ATLAS, NIST IR 8596, and CSA MAESTRO.
    Barcelos et al.''s conclusion is the memorable line: MCP architectures must not rely solely on the
    underlying model''s safety barriers — enforce egress at the protocol layer. Drill the mapping skill:
    each mitigation belongs to a specific layer, and that is what we test.'
  purpose: Map mitigations to layers, following the trust-boundary defense-in-depth frameworks from the
    survey and STRIDE studies.
  citations:
