- id: slide-6178f09fec70
  archived: false
  layout: bullets
  title: Ecosystem Health, Measured
  bullets:
  - 'First large-scale study: 1,899 open-source MCP servers analyzed'
  - 7.2% contain general vulnerabilities; 5.5% show tool poisoning
  - Eight vulnerability classes; only three overlap traditional software bugs
  - 66% show code smells; 14.4% contain known bug patterns
  - Authors call for MCP-specific vulnerability databases and registry scanning
  speaker_notes: 'Hasan et al. (ACM TOSEM 2026) combine a general-purpose static analyzer with an MCP-specific
    scanner. Core finding: MCP''s AI-driven, non-deterministic control flow creates risks that traditional
    maintainability metrics miss — eight vulnerability classes, only three overlapping with traditional
    software bugs. Yet classic refactoring practice still pays off (66% show code smells). Their governance
    asks: MCP-specific vulnerabilities should enter standardized vulnerability databases, and registries
    should run automated MCP-aware scans.'
  purpose: Show that ecosystem security is now an empirical, measurable field with concrete baselines.
  citations:
  - source_id: source-5e60f3795cf5
    label: Hasan et al. 2026, MCP server security & maintainability
    url: null
    line_start: null
    line_end: null
- id: slide-5197a1fb3dfe
  archived: false
  layout: two_column
  title: Benchmarks & Open Problems
  left_content:
  - Benchmarks
  - 'MSB: end-to-end attack benchmark; ASR, PUA, NRP metrics'
  - 'MCP-Universe: 11 real servers, 6 domains, execution-based evaluators'
  - 'Top models struggle: GPT-5 43.7%, Grok-4 33.3%, Claude 29.4%'
  right_content:
  - Open research
  - Capability attestation and trust boundaries for dynamic discovery
  - 'Supply chain: rug pulls, registry integrity, tool provenance'
  - 'Availability: surveyed defenses target integrity, not DoS'
  - Formal security analysis of the MCP specification itself
  speaker_notes: 'MCP-Universe (Salesforce, 2025) is the capability-side benchmark: even top models succeed
    under 44% of the time on real-server tasks, and enterprise agents like Cursor do not beat a standard
    ReAct baseline — capability and security are both open. MSB gives the attack side. Open problems follow
    the surveys: no capability attestation in the spec, rug-pull and supply-chain risk, near-zero availability
    defenses among the 41 surveyed defense papers, and no formal security analysis of the protocol itself.
    Frame these as publishable student projects.'
  purpose: Point to the measurement infrastructure and the frontier of MCP security and capability research.
  citations:
