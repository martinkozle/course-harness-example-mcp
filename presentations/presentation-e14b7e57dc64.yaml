- id: slide-89b5e5e7a447
  archived: false
  layout: closing
  title: Key Takeaways
  text: 'MCP''s power and its risk share one root: the LLM reads untrusted descriptions as instructions.
    Defend in layers — protocol, client, capability, runtime, human. The ecosystem is now large enough
    to measure (10,000+ servers) and weak enough to matter: assume every tool description and response
    is hostile.'
  speaker_notes: 'Assessment mapping: given a threat, name its layer (catalog, session, or transport)
    and propose a layer-appropriate mitigation. Final-project hook: before shipping a server, audit your
    own tool descriptions — the poison vector is the one field you control. Remind students of the outcome
    checklist: draw the trust boundaries, cite a measured result, and name the governance framework a
    mitigation belongs to.'
  purpose: Close by tying threats, evidence, and mitigations back to the course outcomes and the final
    project.
  citations:
