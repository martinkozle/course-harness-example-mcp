  title: Security Risks & the MCP Ecosystem
  subtitle: Threats, benchmarks, and the state of the ecosystem
  speaker_notes: 'Lectures 1-2 gave you the architecture and a working server. Today we turn that same
    architecture into an attack surface: what researchers have actually measured, and where the ecosystem
    stands. End with the assessed skill: mapping a concrete threat to its affected protocol layer and
    proposing a layer-appropriate mitigation.'
  purpose: 'Open Lecture 3: frame security as the central open problem of MCP adoption and preview the
    evidence-based structure of the lecture.'
  citations: []
- id: slide-b6e1e11e563d
  archived: false
  layout: big_statement
  title: The Core Tension
  statement: MCP made tools first-class, composable objects — and first-class attack targets.
  speaker_notes: The same property that makes MCP powerful — tools are discoverable and described in natural
    language for the LLM — is the property an attacker exploits. Nothing on the wire changes compared
    to a normal API; the new risk is semantic. Land the thesis before the details.
  purpose: 'State the lecture''s central thesis: MCP''s defining power is also its defining risk.'
  citations:
