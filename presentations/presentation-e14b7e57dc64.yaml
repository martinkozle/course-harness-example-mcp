- id: slide-494a1fe1a5c6
  archived: false
  layout: bullets
  title: Why the Attack Surface Grew
  bullets:
  - 'Dynamic discovery: tools can appear, disappear, or change between sessions'
  - Descriptions are natural language the LLM reads — data and control conflate
  - One host connects many servers; all descriptions share one LLM context
  - The security gate is the model itself — probabilistic and manipulable
  speaker_notes: 'Bora & Anapu call this a ''probabilistic execution surface'': the consumer of the data
    is itself manipulated through the data — the same data/control conflation behind prompt injection
    (Greshake et al. 2023). Contrast with a plain REST API, where compilers, validators, and frameworks
    enforce the interface mechanically; here the ''validator'' is a language model reading marketing-style
    text.'
  purpose: Explain the three architectural properties that create MCP's distinctive attack surface, contrasting
    MCP with a plain REST API.
  citations:
  - source_id: source-8f67ad0c4f39
    label: Bora & Anapu 2026, MCP security survey & trust boundary framework
