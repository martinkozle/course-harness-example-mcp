  title: The Ecosystem Today
  bullets:
  - Donated to the Linux Foundation's Agentic AI Foundation, Dec 2025
  - 10,000+ public servers; ~97M monthly SDK downloads by late 2025
  - 'Ten official SDKs in a tiered system: TypeScript, Python, C#, Go lead as Tier 1'
  - Adopted by Claude, ChatGPT, Gemini, Copilot, Cursor, VS Code
  - 'Spec evolved through four versions: OAuth, Streamable HTTP, elicitation, tasks'
  speaker_notes: 'Hasan et al. cite 25M+ weekly SDK downloads and 86% of enterprises using MCP-capable
    models; Bora & Anapu report ~97M monthly downloads and 10,000+ public servers by late 2025. Governance
    moved to the Linux Foundation''s Agentic AI Foundation in December 2025. The official SDK page lists
    ten SDKs in a tiered system — TypeScript, Python, C#, Go are Tier 1; Java, Rust Tier 2; Swift, Ruby,
    PHP, Kotlin Tier 3. Also mention the dark side: a December 2025 scan found roughly 1,000 servers exposed
    on the public internet with no authentication at all.'
