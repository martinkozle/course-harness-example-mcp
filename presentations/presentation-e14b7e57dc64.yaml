- id: slide-688a3ed40445
  archived: false
  layout: bullets
  title: What the Benchmarks Measure
  bullets:
  - 'MSB: 12 attack types spanning planning, invocation, and response handling'
  - '2,000 attack instances run against real tools: 10 domains, 405 tools'
  - 'Peak attack success rate: 75.83% across ten agents'
  - 'Paradox: stronger models are more vulnerable, not less'
  - 'Exfiltration study: up to 90% success even on security-tuned models'
  - '160 automated tests, eight models: direct orders and social engineering'
  speaker_notes: 'MSB (ICLR 2026) executes attacks against real tools through MCP rather than simulated
    outputs, and adds Net Resilient Performance (NRP) alongside ASR and PUA to score the security/performance
    trade-off. The SBSeg 2026 study (Barcelos et al.) found models that resist direct orders still leak
    data in seemingly authorized contexts — up to 40% leakage — while security-oriented models reached
    up to 90% successful exfiltration of sensitive files. Emphasize: the ''stronger model = safer'' assumption
    is inverted.'
  purpose: Ground the threats in measured results from MSB and the SBSeg 2026 exfiltration study.
  citations:
  - source_id: source-cb9fbb96c2df
    label: Zhang et al. 2026, MCP Security Bench (MSB)
