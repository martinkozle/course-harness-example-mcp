- id: slide-8e9f9dd76215
  archived: false
  layout: two_column
  title: 'Case Study: Tool Poisoning'
  left_content:
  - How it works
  - Attacker ships a server with plausible-looking tools
  - Malicious instructions hidden in the tool metadata
  - Client lists tools; the LLM reads them at runtime
  - On invocation, the model obeys the hidden instructions
  right_content:
  - What the evidence shows
  - Most prevalent, impactful client-side vulnerability in STRIDE analysis
  - 'Seven major clients: weak static validation, low parameter visibility'
  - 5.5% of 1,899 open-source servers already tool-poisoned in the wild
  speaker_notes: 'Huang et al. apply STRIDE and DREAD to six components — host, client, LLM, server, external
    data stores, authorization server — and conclude tool poisoning dominates the client side. Their proposed
    defense is layered: static metadata analysis, model decision-path tracking, behavioral anomaly detection,
    user transparency. Hasan et al.''s corpus scan found 5.5% of 1,899 open-source servers already tool-poisoned
    in the wild, so this is not a hypothetical. Connect back to Lecture 2: the tool description field
    is the one field students fully control when they build servers.'
  purpose: Walk through tool poisoning end-to-end and show it is measured in the wild, not hypothetical.
  citations:
  - source_id: source-4a440763bffe
    label: Huang et al. 2026, MCP threat modeling & tool poisoning
    url: https://www.mdpi.com/2624-800X/6/3/84
    line_start: null
    line_end: null
