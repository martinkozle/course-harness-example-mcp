- id: slide-fe2abee69a38
  archived: false
  layout: two_column
  title: The Threat Map
  left_content:
  - 'Catalog layer: metadata & discovery'
  - 'Tool poisoning: hidden instructions inside tool descriptions'
  - 'Name collision / tool shadowing: malicious lookalike wins selection'
  - 'Preference manipulation: descriptions engineered to be picked'
  - 'Rug pull: benign server later ships malicious metadata'
  right_content:
  - 'Session layer: responses & data'
  - Indirect prompt injection via tool responses and retrieved content
  - Cross-server data exfiltration through the agent's own tools
  - Credential theft and sampling abuse
  - 'Inter-agent trust: peer commands the model executes'
  speaker_notes: 'Bora & Anapu formalize a ten-class taxonomy covering both layers — including supply-chain
    attacks, rug pulls, and terminal deception. Hou et al. organize 16 threat scenarios across four attacker
    types (malicious developer, external attacker, malicious user, security flaw) and four server-lifecycle
    phases. This two-column split is a pedagogical simplification: catalog threats are planted at install/update
    time, session threats fire at call time. Ask students which layer they''d instrument first.'
  purpose: 'Split MCP threats into two layers: the tool catalog (planted at install time) and the live
    session (fired at call time).'
  citations:
