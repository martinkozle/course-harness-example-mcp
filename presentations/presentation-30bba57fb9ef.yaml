- id: slide-72abb1897139
  archived: false
  layout: big_statement
  title: One Port for Everything
  statement: 'MCP is the USB-C port of AI: one open standard that connects applications to tools, data,
    and workflows.'
  speaker_notes: 'Verbatim from the docs: "Think of MCP like a USB-C port for AI applications. Just as
    USB-C provides a standardized way to connect electronic devices, MCP provides a standardized way to
    connect AI applications to external systems." (MCP documentation, "What is MCP?", 2026-07-28.) The
    slide states the analogy directly because the quote box is too small for the full sentence. The USB-C
    analogy does the heavy lifting: one connector standard, many peripherals, and anything built against
    it works everywhere. MCP standardizes the protocol for context exchange between applications and external
    systems. Point out the scope boundary from the architecture docs: MCP focuses solely on the protocol
    for context exchange; it does not dictate how AI applications use LLMs or manage the context they
    receive.'
  purpose: 'Anchor the mental model: one standard connector for many tools and data sources.'
  citations:
