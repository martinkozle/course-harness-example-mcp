- id: slide-4e1f3f9e0c94
  archived: false
  layout: image
  title: The Architecture Diagram
  image_source_id: source-038f6eca5fe5
  image_url: null
  caption: 'General MCP architecture: one host, one client per server; local servers (A, B) and a remote
    server (C). Source: MCP documentation, general architecture diagram.'
  speaker_notes: 'Walk the diagram left to right. The host (Claude, IDEs, tools) sits on the user''s machine
    and speaks the MCP protocol to each server. Servers A and B run locally and read local data sources
    (files, databases); server C runs on the Internet and reaches remote services through web APIs. Two
    teaching points: first, every server connection is its own dedicated client, so one host scales to
    many servers; second, ''local'' versus ''remote'' is a deployment and transport difference (stdio
    versus Streamable HTTP), not a protocol difference — the same JSON-RPC messages flow in all three
    links.'
  purpose: Visually consolidate the host/client/server model, including local and remote deployments.
