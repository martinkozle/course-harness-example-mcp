- id: slide-ec9a1c3a7cd4
  archived: false
  layout: two_column
  title: Two Layers of the Protocol
  left_content:
  - Data layer (inner)
  - 'JSON-RPC 2.0: requests, responses, notifications'
  - 'Lifecycle: initialization, capability negotiation, termination'
  - 'Server primitives: tools, resources, prompts'
  - 'Client primitives: sampling, elicitation, logging'
  - 'Utilities: notifications and progress tracking'
  right_content:
  - Transport layer (outer)
  - 'Stdio: process streams for local servers, no network overhead'
  - 'Streamable HTTP: POST plus optional Server-Sent Events'
  - Standard HTTP auth; OAuth recommended for tokens
  - Same JSON-RPC message format across all transports
  speaker_notes: 'The key design point is that the transport layer abstracts communication details from
    the protocol layer, so the identical JSON-RPC 2.0 message format works over every transport. Stdio
    uses standard input/output streams for direct process communication on the same machine: optimal performance,
    no network overhead. Streamable HTTP uses HTTP POST for client-to-server messages with optional Server-Sent
    Events for streaming; it enables remote servers and supports standard HTTP authentication (bearer
    tokens, API keys, custom headers), with OAuth recommended for obtaining tokens. The data layer carries
    lifecycle management, the server primitives (tools for actions, resources for context data, prompts
    for interaction templates), the client primitives (sampling, elicitation, logging), and utilities
    like notifications and progress tracking.'
  purpose: Separate what is exchanged (data layer) from how it is exchanged (transport).
  citations:
  - source_id: source-ce1f4bdd0ec1
    label: Architecture overview — data layer and transport layer; stdio and Streamable HTTP transports
    url: null
