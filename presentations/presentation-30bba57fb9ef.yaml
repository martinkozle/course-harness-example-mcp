- id: slide-6e01b8903150
  archived: false
  layout: code
  title: A Request on the Wire
  code: "{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 2,\n  \"method\": \"tools/list\"\n}\n\n{\n  \"jsonrpc\"\
    : \"2.0\",\n  \"id\": 2,\n  \"result\": { \"tools\": [ ... ] }\n}"
  language: json
  speaker_notes: This is the entire wire format. The request carries a unique, non-null id that must not
    be reused within the session; the result response echoes the same id and may carry any JSON object
    as result. Notifications, like notifications/initialized, omit the id entirely and the receiver MUST
    NOT respond. On failure the response carries an error object with an integer code and a message. In
    the docs' example, tools/list returns a tools array where each entry has name, title, description,
    and a JSON Schema inputSchema; the host aggregates tools from all connected servers into one registry
    the LLM can call. Discovery first (tools/list), execution second (tools/call) — that pattern holds
    for resources and prompts too.
  purpose: Show the JSON-RPC 2.0 request/response format that underlies all MCP traffic.
  citations:
  - source_id: source-6b90b0bc68c7
    label: Specification 2025-11-25 — request, response, and notification message rules
    url: null
    line_start: null
    line_end: null
