- id: slide-8041493cd041
  archived: false
  layout: bullets
  title: The Integration Problem
  bullets:
  - Before MCP, every AI app hand-rolled integrations for each tool and data source
  - N apps x M tools meant N x M one-off connectors, each with its own schema
  - Tool-calling formats were provider-specific, fragmenting the ecosystem across vendors
  - Context stayed locked in one app; switching providers meant rebuilding integrations
  - No shared standard existed for how models discover and invoke external capabilities
  speaker_notes: 'Walk through the N-by-M matrix: before MCP, every new AI application had to re-implement
    every integration by hand. The specification frames MCP''s motivation directly: it takes inspiration
    from the Language Server Protocol, which standardized adding language support across a whole tool
    ecosystem; MCP does the same for context and tools across the ecosystem of AI applications. Emphasize
    that pre-MCP ''tool calling'' was a per-provider API feature, not an interoperable protocol, which
    is why integrations could not move between apps or vendors.'
  purpose: Show the pre-MCP fragmentation cost that motivates a standard protocol.
