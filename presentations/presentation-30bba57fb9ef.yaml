  layout: title
  title: Why MCP Exists
  subtitle: The fragmentation problem and the client/host/server architecture
  speaker_notes: 'Welcome. You already know HTTP and JSON; MCP is built directly on both: JSON-RPC 2.0
    messages carried over stdio or HTTP. Today: (1) the integration problem MCP solves, (2) the host/client/server
    architecture, (3) the two protocol layers, (4) lifecycle and capability negotiation, and (5) what
    a real message looks like on the wire. By the end you should be able to trace a request from a host
    through a client to a server, and explain why the architecture draws these security boundaries.'
  purpose: 'Frame the lecture: what MCP standardizes, why it exists, and how its architecture is organized.'
  citations:
