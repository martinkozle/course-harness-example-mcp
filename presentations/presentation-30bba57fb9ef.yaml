- id: slide-034c04bd1168
  archived: false
  layout: bullets
  title: Lifecycle & Capability Negotiation
  bullets:
  - 'MCP is stateful: every session starts with an initialize handshake'
  - The handshake negotiates protocol version, capabilities, and identity
  - Servers declare tools, resources, prompts, and list-changed support
  - Clients declare what they support, e.g. elicitation
  - If no compatible protocol version is found, the connection terminates
  - After init, the client sends notifications/initialized
  speaker_notes: 'Use the documentation''s worked example. The client sends initialize with protocolVersion
    2025-11-25, its capabilities (e.g. elicitation), and clientInfo. The server replies with its own capabilities:
    in the example, tools with listChanged true (it can send tools/list_changed notifications), and resources.
    The handshake serves three purposes: protocol version negotiation (terminate if no compatible version),
    capability discovery (each side declares which primitives and features it handles), and identity exchange
    (clientInfo and serverInfo for debugging). After successful initialization the client sends notifications/initialized,
    a one-way notification with no response. All implementations MUST support the base protocol and lifecycle
    management; capabilities decide what is available for the rest of the session.'
  purpose: Explain how a session is established and how each side learns what the other supports.
  citations:
  - source_id: source-ce1f4bdd0ec1
    label: Architecture overview — lifecycle management and the initialization exchange example
    url: null
    line_start: null
    line_end: null
  - source_id: source-6b90b0bc68c7
    label: 'Specification 2025-11-25 — lifecycle management: connection initialization, capability negotiation,
      and session control'
