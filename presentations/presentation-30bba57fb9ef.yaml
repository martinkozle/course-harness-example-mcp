- id: slide-ac71d1415fe3
  archived: false
  layout: closing
  title: Key Takeaways
  text: 'MCP is an open, JSON-RPC-based standard. A host runs isolated clients, each holding a 1:1 stateful
    session to a server that exposes tools, resources, and prompts over stdio or Streamable HTTP. Next
    lecture: build a server that exposes all three.'
  speaker_notes: 'Recap in one breath: the problem (N-by-M integration fragmentation), the fix (one open,
    JSON-RPC-based standard), the participants (host coordinates isolated clients, one stateful 1:1 session
    per server), the layers (data layer for what, transport layer for how), and the lifecycle (initialize,
    negotiate capabilities, then work). Preview Lecture 2: we scaffold a real MCP server with an official
    SDK, expose one tool, one resource, and one prompt with proper JSON Schemas, and test it end to end
    with the MCP Inspector.'
  purpose: Consolidate the architecture model and preview the building lab.
