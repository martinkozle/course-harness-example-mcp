- id: slide-d77675ae180d
  archived: false
  layout: two_column
  title: Host, Client, Server
  left_content:
  - Inside the host
  - 'Host: the AI application, e.g. Claude Desktop or VS Code'
  - Coordinates and manages one or more MCP clients
  - 'Client: one per server, a dedicated 1:1 connection'
  - Each client maintains a stateful session with its server
  right_content:
  - The server
  - 'Server: a program that provides context and capabilities'
  - Local over stdio, or remote over Streamable HTTP
  - Local servers typically serve a single client
  - Remote servers typically serve many clients
  speaker_notes: 'Use the documentation''s running example: Visual Studio Code is the host. When it connects
    to the Sentry server, the VS Code runtime instantiates a client object for Sentry; when it also connects
    to a local filesystem server, it instantiates a second client. So one host, many clients, one client
    per server, and each client holds a dedicated stateful connection. ''Local'' versus ''remote'' describes
    where the server process runs and which transport it uses (stdio versus Streamable HTTP), not a different
    architecture: a server is simply the program that provides context to clients. Local stdio servers
    typically serve one client; remote Streamable HTTP servers typically serve many.'
  purpose: Define the three participants and the 1:1 client-to-server relationship.
  citations:
  - source_id: source-ce1f4bdd0ec1
    label: Architecture overview — host, client, and server participants; VS Code example; local vs remote
      servers
    url: null
    line_start: null
