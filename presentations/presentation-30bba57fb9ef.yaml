- id: slide-3a71a70001eb
  archived: false
  layout: bullets
  title: What MCP Provides
  bullets:
  - An open protocol anyone can implement, free of vendor lock-in
  - A growing set of pre-built integrations that plug straight into your LLM app
  - Flexibility to switch between apps and providers, taking your context with you
  - A standard way to build custom integrations for any AI application
  - 'Broad ecosystem support: Claude, ChatGPT, VS Code, Cursor and many more'
  speaker_notes: 'Frame benefits by stakeholder, as the docs do: developers save development time and
    complexity when building or integrating AI applications; AI applications gain access to an ecosystem
    of data sources, tools, and apps; end users get more capable agents that can access their data and
    act on their behalf. The ecosystem point is what makes it a standard rather than a library: Claude,
    ChatGPT, VS Code, Cursor, and many others all support MCP, so build once and integrate everywhere.'
  purpose: Summarize what the standard gives developers, AI applications, and end users.
  citations:
