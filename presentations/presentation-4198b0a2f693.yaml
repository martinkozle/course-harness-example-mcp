- id: slide-0fc774f95936
  archived: false
  layout: bullets
  title: What a Server Is
  bullets:
  - A program that exposes capabilities to AI apps via a standard protocol
  - 'Examples: file system, database, GitHub, Slack, and calendar servers'
  - One server = one domain of functionality (e.g. weather, files)
  - Official SDKs in many languages; Python and TypeScript are Tier 1
  - The same SDK builds servers and clients across stdio and HTTP
  speaker_notes: 'An MCP server is just a program. It wraps some capability — a database, a REST API,
    the file system — and exposes it over the MCP protocol so any host can use it. The official docs list
    file system, database, GitHub, Slack, and calendar servers as common examples. You don''t write protocol
    code by hand: the official SDKs (Python and TypeScript are Tier 1, alongside C# and Go) handle the
    wire format, and the same SDK lets you build both servers and clients.'
  purpose: Define what an MCP server is and name the official SDKs that make one easy to build.
