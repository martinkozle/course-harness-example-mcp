- id: slide-7f84a96e388e
  archived: false
  layout: two_column
  title: The Three Building Blocks
  left_content:
  - Tools (model-controlled)
  - Functions the LLM actively calls based on context
  - Can write to databases, call APIs, or modify files
  - Schema-defined; each performs one clearly typed operation
  - Discovered via tools/list, executed via tools/call
  - May require user consent before running
  right_content:
  - Resources & Prompts
  - 'Resources (app-controlled): read-only context data'
  - Each has a URI and a MIME type
  - Fixed URIs, or parameterized resource templates
  - 'Prompts (user-controlled): pre-built instruction templates'
  - Guide the model to use specific tools and resources
  speaker_notes: 'Servers expose capabilities through exactly three building blocks, and it matters who
    controls each. Tools are model-controlled: the LLM decides when to call them, and they can do real,
    sometimes destructive work — writing to a database, sending a message, modifying a file — so MCP supports
    user consent before a tool runs. Resources are application-controlled: read-only, passive data such
    as file contents, schemas, or API docs, each identified by a URI and a MIME type; you can have fixed
    direct resources or parameterized templates like travel://activities/{city}/{category}. Prompts are
    user-controlled: pre-built instruction templates that nudge the model to use particular tools and
    resources together. On the wire, tools use tools/list and tools/call; resources use resources/list,
    resources/templates/list, resources/read, and resources/subscribe.'
  purpose: Separate the three server capabilities and who controls each, with their wire methods.
