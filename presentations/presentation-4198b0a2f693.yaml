- id: slide-0bcb7e296a53
  archived: false
  layout: bullets
  title: Debugging with the Inspector
  bullets:
  - 'The MCP Inspector: the reference tool for testing servers'
  - 'One package, three clients: Web, CLI, and TUI'
  - 'Web: npx @modelcontextprotocol/inspector opens a browser UI'
  - 'CLI: --cli is scriptable for CI (tools/list, tools/call)'
  - 'TUI: --tui gives an interactive terminal client'
  - uv run mcp dev server.py opens the Inspector for you
  speaker_notes: 'The MCP Inspector is the reference developer tool for testing and debugging MCP servers.
    It ships as one package, @modelcontextprotocol/inspector, with three clients behind one binary, all
    built on the same core so a connection behaves identically. The Web client (npx @modelcontextprotocol/inspector)
    is the richest — a full graphical inspector in the browser where you list tools, fill in the generated
    argument forms, and watch the JSON-RPC exchange. The CLI client (add --cli) is scriptable and machine-readable,
    ideal for CI, shell pipelines, and coding agents: for example --method tools/list to enumerate tools,
    or --method tools/call --tool-name get_weather --tool-arg city=Boston --format json piped into jq.
    The TUI client (add --tui) is an interactive terminal UI for when a browser is not available. It needs
    Node 22.19 or newer and runs straight through npx. In the Python SDK, uv run mcp dev server.py starts
    your server and opens the Inspector automatically.'
  purpose: Introduce the MCP Inspector's three clients and how to launch and script it.
