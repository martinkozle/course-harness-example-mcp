- id: slide-3cccfc9116ec
  archived: false
  layout: code
  title: A Complete Server in Ten Lines
  code: "from mcp.server import MCPServer\nmcp = MCPServer(\"Demo\")\n\n@mcp.tool()\ndef add(a: int, b:\
    \ int) -> int:\n    \"\"\"Add two numbers.\"\"\"\n    return a + b\n\n@mcp.resource(\"greeting://{name}\"\
    )\ndef greeting(name: str) -> str:\n    \"\"\"Greet someone by name.\"\"\"\n    return f\"Hello, {name}!\""
  language: python
  speaker_notes: 'This is a complete, working MCP server: one tool (add) and one templated resource (greeting://{name}).
    There is no JSON Schema anywhere — a: int, b: int is the schema, and the docstrings become the descriptions.
    The SDK generates tool definitions, validates arguments, and handles the JSON-RPC. Run it with uv
    run mcp dev server.py, which starts the server and opens the MCP Inspector; call add with a=1, b=2
    to get 3, and read greeting://World to get ''Hello, World!'' The same pattern works in TypeScript
    and the other official SDKs. (The official build-a-server tutorial uses the equivalent FastMCP class
    for its weather server.)'
  purpose: Show a minimal, complete server that exposes a tool and a resource using type hints.
  citations:
