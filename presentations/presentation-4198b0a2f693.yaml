- id: slide-aeb4f81e0e9f
  archived: false
  layout: bullets
  title: Running & Wiring the Server
  bullets:
  - 'Run it over stdio: mcp.run(transport="stdio")'
  - The host launches it and speaks JSON-RPC over the pipe
  - 'STDIO servers: never log to stdout — it corrupts JSON-RPC'
  - Log to stderr or a file instead (a logging library)
  - 'HTTP servers: ordinary stdout logging is fine'
  - Wire it into a host, e.g. a Claude for Desktop config
  speaker_notes: 'The quickstart weather server runs over stdio: mcp.run(transport=''stdio''). The host
    — Claude for Desktop in the tutorial — launches the server as a child process and talks JSON-RPC over
    stdin/stdout. That is why the logging rule matters: for stdio servers, anything written to stdout
    is interpreted as a protocol message, so a stray print() corrupts the JSON-RPC stream and breaks the
    server. Use file=sys.stderr or a logging library that writes to stderr or a file. For HTTP-based (Streamable
    HTTP) servers, stdout is fine because it does not carry the protocol. To connect the server you edit
    the host config — for Claude for Desktop that is claude_desktop_config.json under the mcpServers key
    — with the command (uv) and args that launch your server, using an absolute path. The official tutorial
    builds a weather server exposing get_alerts and get_forecast as its two tools.'
  purpose: Explain how a stdio server is launched, wired into a host, and the stdout logging gotcha.
