- id: slide-be6ee50e2140
  archived: false
  layout: closing
  title: Key Takeaways & Lab
  text: 'A server is a program exposing tools, resources, and prompts. With an official SDK, a few type-annotated
    functions become a working server: run it over stdio, wire it into a host, and debug it with the Inspector.
    Lab: scaffold a Python or TypeScript server, expose one tool, one resource, and one prompt, and verify
    each in the Inspector.'
  speaker_notes: 'Recap: an MCP server is a program exposing three building blocks — tools (model-controlled),
    resources (application-controlled), and prompts (user-controlled). The official SDKs do the heavy
    lifting: type hints become JSON Schema, docstrings become descriptions, and the SDK handles validation
    and the JSON-RPC wire. You run the server over stdio, wire it into a host via its config, and remember
    the stdout logging rule for stdio servers. You debug everything with the MCP Inspector''s web, CLI,
    and TUI clients. For the lab, scaffold a server in Python or TypeScript, expose at least one tool,
    one resource, and one prompt with correct schemas, then verify each in the Inspector. Next, Lecture
    3 turns to the security risks of the servers you now know how to build.'
  purpose: Consolidate the building workflow and assign the scaffold-and-test lab.
